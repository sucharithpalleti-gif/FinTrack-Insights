[project]
name = "expense-ledger-workspace"
version = "0.1.0"
description = "Python dependencies for the Expense Ledger Flask API."
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pymysql>=1.2.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
